name: build-tv-chrome66

on:
  push:
    branches: [chrome66-compat]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (chrome66, BigInt -> JSBI)
        run: npm run build:android:ui

      - name: Ensure compatible debug keystore exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build TV release APK
        run: bash scripts/build-android.sh --tv-release-compatible

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-tv-chrome66
          path: |
            dist/android/*.apk
            dist/android/SHA256SUMS*.txt
          if-no-files-found: error
