name: build-tv-chrome66

on:
  push:
    branches: [chrome66-compat]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (chrome66, BigInt -> JSBI)
        run: npm run build:android:ui

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build TV release APK
        run: bash scripts/build-android.sh --tv-release-compatible
        env:
          HONGGUO_COMPAT_KEYSTORE: ${{ github.workspace }}/android/debug-compat.p12

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-tv-chrome66
          path: |
            dist/android/*.apk
            dist/android/SHA256SUMS*.txt
          if-no-files-found: error
